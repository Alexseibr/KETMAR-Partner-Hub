version: '3.9'

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
  partner-api:
    build: ./apps/partner-api
    environment:
      - MONGO_URL=${MONGO_URL:-mongodb://mongo:27017/ketmar_partner_hub}
      - PORT=3001
    depends_on:
      - mongo
    ports:
      - '3001:3001'
  partner-web:
    build: ./apps/partner-web
    environment:
      - PARTNER_API_TARGET=http://partner-api:3001
    depends_on:
      - partner-api
    ports:
      - '5173:5173'
  courier-web:
    build: ./apps/courier-web
    environment:
      - PARTNER_API_TARGET=http://partner-api:3001
    depends_on:
      - partner-api
    ports:
      - '5174:5174'
  nginx:
    image: nginx:1.25
    depends_on:
      - partner-api
      - partner-web
      - courier-web
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - '80:80'

volumes:
  mongo-data:
