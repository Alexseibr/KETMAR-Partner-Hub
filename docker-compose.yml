version: '3.9'
services:
  mongo:
    image: mongo:7
    container_name: mongo
    restart: always
    environment:
      MONGO_INITDB_DATABASE: ketmar_partner_hub
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  partner-api:
    build:
      context: .
      dockerfile: apps/partner-api/Dockerfile
    container_name: partner-api
    environment:
      - PORT=3001
      - MONGO_URL=mongodb://mongo:27017/ketmar_partner_hub
    depends_on:
      - mongo
    ports:
      - "3001:3001"

  partner-web:
    build:
      context: .
      dockerfile: apps/partner-web/Dockerfile
    container_name: partner-web
    environment:
      - PORT=5173
    depends_on:
      - partner-api
    ports:
      - "5173:5173"

  courier-web:
    build:
      context: .
      dockerfile: apps/courier-web/Dockerfile
    container_name: courier-web
    environment:
      - PORT=5174
    depends_on:
      - partner-api
    ports:
      - "5174:5174"

  public-web:
    build:
      context: .
      dockerfile: apps/public-web/Dockerfile
    container_name: public-web
    environment:
      - PORT=3002
      - PUBLIC_API_BASE=http://partner-api:3001
    depends_on:
      - partner-api
    ports:
      - "3002:3002"

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx-router
    depends_on:
      - partner-api
      - partner-web
      - courier-web
      - public-web
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  mongo_data:
